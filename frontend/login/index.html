<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autumn Forest Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <!-- Soft autumn sky and glowing horizon -->
    <div class="sky"></div>
    <div class="sun-glow"></div>

    <!-- Distant hills and forest layers -->
    <div class="hills hills-back"></div>
    <div class="forest forest-back">
      <div class="tree group group-1">
        <div class="trunk"></div>
        <div class="crown crown-large"></div>
        <div class="crown crown-medium"></div>
      </div>
      <div class="tree group group-2">
        <div class="trunk"></div>
        <div class="crown crown-large"></div>
        <div class="crown crown-small"></div>
      </div>
      <div class="tree group group-3">
        <div class="trunk"></div>
        <div class="crown crown-large"></div>
      </div>
    </div>

    <div class="hills hills-front"></div>
    <div class="forest forest-front">
      <div class="tree group group-4">
        <div class="trunk"></div>
        <div class="crown crown-large"></div>
        <div class="crown crown-medium"></div>
      </div>
      <div class="tree group group-5">
        <div class="trunk"></div>
        <div class="crown crown-large"></div>
      </div>
      <div class="tree group group-6">
        <div class="trunk"></div>
        <div class="crown crown-large"></div>
        <div class="crown crown-small"></div>
      </div>
    </div>

    <!-- Ambient dust and glow particles -->
    <div class="particle-layer"></div>

    <!-- Leaf layers creating depth -->
    <div class="leaf-layer behind"></div>

    <!-- Centered card stack -->
    <div class="card-stack">
      <section class="login-card card">
        <div class="login-card__header">
          <span class="badge">Autumn Access</span>
          <h1>Welcome back</h1>
          <p>Login to unlock your warm autumn dashboard.</p>
        </div>

        <div class="card-body">
          <form class="login-form">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" autocomplete="username" placeholder="Enter your username" />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" autocomplete="current-password" placeholder="Enter your password" />
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
          </form>

          <div class="login-links">
            <a href="#">Forgot Password?</a>
            <a href="#">Create Account</a>
          </div>
        </div>
      </section>

      <section class="profile-card card">
        <div class="login-card__header">
          <span class="badge">Profile</span>
          <h1>Your Profile</h1>
          <p>Update the information that helps personalize your account.</p>
        </div>

        <div class="card-body">
          <form class="profile-form">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" placeholder="Enter full name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="you@example.com" />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" placeholder="(123) 456-7890" />
            </div>
            <div class="mb-3">
              <label class="form-label">Bio</label>
              <textarea class="form-control" rows="3" placeholder="Tell us a little about yourself"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Save Profile</button>
          </form>
        </div>
      </section>
    </div>

    <div class="leaf-layer front"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
